<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    
    <title>Запись в клинику «ЯСНО ВИЖУ»</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
    
    <style>
        :root { --yasno-main: #32a396; --yasno-accent: #59c2b1; --bg-color: #ffffff; --secondary-bg: #f0fdfa; --card-bg: rgba(255, 255, 255, 0.85); --text-main: #1a202c; --border-color: rgba(89, 194, 177, 0.2); }
        @keyframes gradientBG { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
        
        /* Жесткая фиксация высоты экрана и отключение глобального скролла */
        body { 
            font-family: 'Inter', sans-serif; 
            margin: 0; 
            background: var(--bg-color); 
            color: var(--text-main); 
            height: 100vh; 
            height: 100dvh; 
            overflow: hidden; 
            display: flex; 
            flex-direction: column; 
        }
        #app {
            display: flex;
            flex-direction: column;
            height: 100%;
            width: 100%;
            overflow: hidden;
        }
        /* Новый класс для внутренней области скролла */
        .scroll-container {
            flex-grow: 1;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            padding-bottom: 40px;
        }

        .dynamic-bg { background: linear-gradient(-45deg, var(--bg-color), var(--secondary-bg), var(--bg-color)); background-size: 400% 400%; animation: gradientBG 12s ease infinite; }
        .bg-yasno-header { background: linear-gradient(135deg, #32a396 0%, #3baea0 100%); position: relative; z-index: 20; padding: 24px 0; } 
        @keyframes logoPulse { 0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(89, 194, 177, 0.4); } 50% { transform: scale(1.05); box-shadow: 0 0 0 10px rgba(89, 194, 177, 0); } 100% { transform: scale(1); } }
        .logo-pulse { animation: logoPulse 2s infinite ease-in-out; }
        @keyframes slideIn { from { transform: translateX(30px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        .view-animate { animation: slideIn 0.4s cubic-bezier(0.25, 1, 0.5, 1) forwards; }
        .choice-card { position: relative; overflow: hidden; border-radius: 28px; z-index: 1; border: 1px solid var(--border-color); }
        .choice-card::after { content: ""; position: absolute; top: 0; left: 0; width: 300%; height: 100%; background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent); animation: wave-pass 3.5s infinite linear; pointer-events: none; z-index: 2; }
        @keyframes wave-pass { 0% { transform: translateX(-150%) skewX(-25deg); } 100% { transform: translateX(150%) skewX(-25deg); } }
        .glass-card { background: var(--card-bg); backdrop-filter: blur(12px); border: 1px solid var(--border-color); border-radius: 28px; box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.1); }
        .btn-yasno { background-color: var(--yasno-accent); color: #ffffff; font-weight: 700; border-radius: 9999px; transition: all 0.2s; cursor: pointer; border: none; }
        .btn-yasno:active { transform: scale(0.96); }
        .btn-yasno:disabled { opacity: 0.7; pointer-events: none; }
        .input-yasno { background: var(--secondary-bg); color: var(--text-main); border: 2px solid var(--border-color); border-radius: 16px; padding: 14px; width: 100%; outline: none; transition: border-color 0.2s; }
        .input-yasno:focus { border-color: var(--yasno-main); }
        .circle-btn { width: 48px !important; height: 48px !important; flex-shrink: 0 !important; border-radius: 999px !important; display: flex; align-items: center; justify-content: center; aspect-ratio: 1 / 1 !important; }
        .nav-btn { font-weight: 800; font-size: 11px; color: var(--yasno-main); text-transform: uppercase; display: flex; align-items: center; gap: 6px; padding: 10px 0; background: none; border: none; cursor: pointer; }
        
        .schedule-row { display: flex; border-bottom: 1px solid rgba(89, 194, 177, 0.2); padding: 16px 0; }
        .schedule-row:last-child { border-bottom: none; }
        .schedule-date-col { width: 35%; padding-right: 12px; text-align: right; border-right: 1px solid rgba(89, 194, 177, 0.2); }
        .schedule-slots-col { width: 65%; padding-left: 16px; display: flex; flex-wrap: wrap; gap: 8px; align-content: flex-start; }
        .time-slot { border: 1.5px solid var(--yasno-main); color: var(--yasno-main); font-weight: 600; border-radius: 8px; padding: 6px 12px; font-size: 14px; background: white; transition: all 0.1s; cursor: pointer; }
        .time-slot:active { background: var(--yasno-main); color: white; }
    </style>
</head>
<body class="dynamic-bg">
    
    <div id="app">
        <div class="bg-yasno-header px-6 shadow-xl relative z-20 flex-shrink-0">
            <div class="max-w-md mx-auto flex items-center">
                <div class="flex-shrink-0 w-20 h-20 bg-white rounded-full border-[4px] border-[#59c2b1] overflow-hidden flex items-center justify-center shadow-md logo-pulse">
                    <img src="/max/Логотип.png" class="w-[85%] h-[85%] object-contain" alt="Логотип">
                </div>
                <div class="flex flex-col items-center flex-grow pl-4 text-white font-bold text-center">
                    <div class="text-[28px] uppercase tracking-tighter leading-none mb-1.5">ЯСНО ВИЖУ</div>
                    <div class="text-[10px] uppercase tracking-[0.1em] opacity-90 leading-tight">ОФТАЛЬМОЛОГИЧЕСКАЯ КЛИНИКА</div>
                </div>
            </div>
        </div>

        <div class="scroll-container relative z-10 w-full">
            <div class="max-w-md mx-auto px-6 mt-4 relative">
                
                <div v-if="accessError" class="text-center py-24 px-6 view-animate">
                    <div class="text-6xl mb-6">🤖</div>
                    <h2 class="text-2xl font-black text-red-500 mb-4">Ошибка доступа</h2>
                    <p class="text-gray-500 text-sm leading-relaxed">Пожалуйста, запустите приложение, нажав на кнопку <b>«Записаться ✅»</b> в сообщении от бота.</p>
                </div>

                <template v-else>
                    <div v-if="currentView === 'view-branches'" class="view-animate">
                        <h1 class="text-xl font-bold mb-6 text-center">
                            <template v-if="isRescheduling"><span class="text-teal-500">Перенос записи:</span><br></template>
                            Выберите филиал
                        </h1>
                        <div class="space-y-4 mb-6">
                            <div @click="selectBranch('Профсоюзная')" class="glass-card choice-card p-6 flex justify-between items-center cursor-pointer active:scale-95 transition-all">
                                <span class="text-lg font-bold">Профсоюзная</span>
                                <div class="bg-[#59c2b1] text-white circle-btn shadow-md text-xl">→</div>
                            </div>
                            <div @click="selectBranch('Ватутинки')" class="glass-card choice-card p-6 flex justify-between items-center cursor-pointer active:scale-95 transition-all" style="animation-delay: 0.1s">
                                <span class="text-lg font-bold">Новые Ватутинки</span>
                                <div class="bg-[#59c2b1] text-white circle-btn shadow-md text-xl">→</div>
                            </div>
                        </div>
                        <button v-if="!isRescheduling" @click="checkMyAppointment" class="w-full py-4 text-sm font-bold text-[#32a396] uppercase border-2 border-[#59c2b1] rounded-full mt-2 bg-white cursor-pointer shadow-sm">Мои записи</button>
                    </div>

                    <div v-if="currentView === 'view-path'" class="view-animate">
                        <div class="flex justify-between items-center mb-4">
                            <button @click="showView('view-branches')" class="nav-btn">← Назад</button>
                            <button @click="showView('view-branches')" class="nav-btn">Меню 🏠</button>
                        </div>
                        <h1 class="text-xl font-bold mb-6 text-center">Как вы хотите записаться?</h1>
                        <div class="space-y-4">
                            <div @click="selectPath('doctor')" class="glass-card choice-card p-6 flex justify-between items-center cursor-pointer active:scale-95 transition-all">
                                <div>
                                    <div class="text-lg font-bold text-[#32a396]">Выбрать врача</div>
                                    <div class="text-xs opacity-70 mt-1">Если знаете, к какому специалисту идти</div>
                                </div>
                                <div class="bg-gray-100 text-teal-600 circle-btn text-xl">👨‍⚕️</div>
                            </div>
                            <div @click="selectPath('service')" class="glass-card choice-card p-6 flex justify-between items-center cursor-pointer active:scale-95 transition-all">
                                <div>
                                    <div class="text-lg font-bold text-[#32a396]">Выбрать услугу</div>
                                    <div class="text-xs opacity-70 mt-1">Подберем врача под вашу потребность</div>
                                </div>
                                <div class="bg-gray-100 text-teal-600 circle-btn text-xl">📋</div>
                            </div>
                        </div>
                    </div>

                    <div v-if="currentView === 'view-doctors'" class="view-animate">
                        <div class="sticky top-0 z-30 flex justify-between items-center mb-4 py-2 -mx-2 px-2 bg-white/80 backdrop-blur-md rounded-b-xl shadow-sm">
                            <button @click="goBackFromDoctors" class="nav-btn">← Назад</button>
                            <button @click="showView('view-branches')" class="nav-btn">Меню 🏠</button>
                        </div>
                        <h1 class="text-xl font-bold mb-6 text-center">Наши специалисты</h1>
                        
                        <div v-if="loadingDoctors" class="py-10 text-center text-teal-600 font-bold animate-pulse">Загрузка врачей...</div>
                        <div v-else-if="doctorsList.length === 0" class="py-10 text-center opacity-50 font-bold uppercase text-[10px]">Врачи не найдены</div>
                        <div v-else class="space-y-4">
                            <div v-for="d in doctorsList" :key="d.id" @click="selectDoctor(d)" class="glass-card choice-card p-5 flex justify-between items-center mb-3 cursor-pointer active:scale-95 transition-all">
                                <div>
                                    <div class="font-bold">{{ d.full_name }}</div>
                                    <div class="text-[10px] text-teal-600 font-bold uppercase">{{ d.specialty_name || 'Врач' }}</div>
                                </div>
                                <div class="bg-[#59c2b1] text-white circle-btn shadow-md text-xl flex-shrink-0">→</div>
                            </div>
                        </div>
                    </div>

                    <div v-if="currentView === 'view-services'" class="view-animate">
                        <div class="sticky top-0 z-30 flex justify-between items-center mb-4 py-2 -mx-2 px-2 bg-white/80 backdrop-blur-md rounded-b-xl shadow-sm">
                            <button @click="goBackFromServices" class="nav-btn">← Назад</button>
                            <button @click="showView('view-branches')" class="nav-btn">Меню 🏠</button>
                        </div>
                        <h1 class="text-xl font-bold mb-6 text-center">Выберите услугу</h1>
                        
                        <div v-if="loadingServices" class="py-10 text-center text-teal-600 font-bold animate-pulse" v-html="loadingServicesText"></div>
                        <div v-else-if="servicesPrimary.length === 0 && servicesSecondary.length === 0" class="py-10 text-center opacity-50 font-bold uppercase text-[10px]">Услуги не найдены</div>
                        <div v-else>
                            <div v-if="servicesPrimary.length > 0" class="mb-6">
                                <h2 class="text-[11px] font-black uppercase tracking-widest text-teal-600 mb-3 ml-2 opacity-80">Первичная диагностика</h2>
                                <div class="space-y-3">
                                    <div v-for="s in servicesPrimary" :key="s.id" @click="selectService(s)" class="glass-card choice-card p-5 flex justify-between items-center cursor-pointer active:scale-95 transition-all">
                                        <div class="pr-4">
                                            <div class="font-bold text-sm leading-tight">{{ s.displayName }}</div>
                                            <div v-if="s.price" class="text-[12px] text-teal-600 font-black mt-1.5">{{ formatPrice(s.price) }}</div>
                                        </div>
                                        <div class="bg-[#59c2b1] text-white circle-btn shadow-md text-xl flex-shrink-0">→</div>
                                    </div>
                                </div>
                            </div>
                            <div v-if="servicesSecondary.length > 0" class="mb-6">
                                <h2 class="text-[11px] font-black uppercase tracking-widest text-teal-600 mb-3 ml-2 opacity-80">Повторная диагностика</h2>
                                <div class="space-y-3">
                                    <div v-for="s in servicesSecondary" :key="s.id" @click="selectService(s)" class="glass-card choice-card p-5 flex justify-between items-center cursor-pointer active:scale-95 transition-all">
                                        <div class="pr-4">
                                            <div class="font-bold text-sm leading-tight">{{ s.displayName }}</div>
                                            <div v-if="s.price" class="text-[12px] text-teal-600 font-black mt-1.5">{{ formatPrice(s.price) }}</div>
                                        </div>
                                        <div class="bg-[#59c2b1] text-white circle-btn shadow-md text-xl flex-shrink-0">→</div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div v-if="currentView === 'view-schedule-multi'" class="view-animate">
                        <div class="sticky top-0 z-30 flex justify-between items-center mb-4 py-2 -mx-2 px-2 bg-white/80 backdrop-blur-md rounded-b-xl shadow-sm">
                            <button @click="goBackFromSchedule" class="nav-btn">← Назад</button>
                            <button @click="showView('view-branches')" class="nav-btn">Меню 🏠</button>
                        </div>
                        
                        <div class="glass-card p-4 mb-4">
                            <div class="text-[11px] uppercase tracking-widest text-teal-600 font-bold mb-1">Специалист</div>
                            <div class="font-bold leading-tight">{{ curDoc.name }}</div>
                            <div class="text-[11px] uppercase tracking-widest text-teal-600 font-bold mb-1 mt-3">Услуга</div>
                            <div class="font-medium text-sm leading-tight">{{ curService.displayName }}</div>
                        </div>

                        <div class="sticky top-12 z-20 bg-[#32a396] text-white rounded-xl p-3 mb-4 flex justify-between items-center shadow-md">
                            <button @click="shiftSchedule(-4)" class="px-3 py-1 bg-white/20 rounded-lg font-bold active:bg-white/40 border-none cursor-pointer">❮</button>
                            <span class="font-bold text-sm tracking-wide">{{ schedulePeriodLabel }}</span>
                            <button @click="shiftSchedule(4)" class="px-3 py-1 bg-white/20 rounded-lg font-bold active:bg-white/40 border-none cursor-pointer">❯</button>
                        </div>
                        
                        <div class="glass-card px-2 py-2 min-h-[200px]">
                            <div v-if="loadingSchedule" class="py-12 text-center text-teal-600 font-bold animate-pulse text-sm uppercase tracking-widest">Поиск окошек...</div>
                            <div v-else-if="scheduleDays.length === 0" class="py-10 text-center text-red-500 text-sm">Ошибка получения расписания</div>
                            <template v-else>
                                <div v-for="day in scheduleDays" :key="day.dateStr" class="schedule-row">
                                    <div class="schedule-date-col">
                                        <div class="text-[10px] uppercase text-gray-400 font-bold mb-0.5">{{ day.isToday ? 'Сегодня' : '' }}</div>
                                        <div class="font-black text-2xl leading-none" :class="day.isToday ? 'text-teal-600' : 'text-gray-800'">{{ day.dateNum }}</div>
                                        <div class="text-[10px] text-gray-500 uppercase mt-1">{{ day.dayName }}</div>
                                    </div>
                                    <div class="schedule-slots-col">
                                        <button v-for="time in day.slots" :key="time" @click="selectTime(day.dateStr, time)" class="time-slot">{{ time }}</button>
                                        <span v-if="day.slots.length === 0" class="text-xs text-gray-400 font-medium py-1">Нет записи</span>
                                    </div>
                                </div>
                            </template>
                        </div>
                    </div>

                    <div v-if="currentView === 'view-booking'" class="view-animate">
                        <div class="sticky top-0 z-30 flex justify-between items-center mb-4 py-2 -mx-2 px-2 bg-white/80 backdrop-blur-md rounded-b-xl shadow-sm">
                            <button @click="showView('view-schedule-multi')" class="nav-btn">← Назад</button>
                            <button @click="showView('view-branches')" class="nav-btn">Меню 🏠</button>
                        </div>
                        
                        <div class="bg-teal-50 rounded-xl p-4 mb-6 border border-teal-100 text-center">
                            <div class="text-teal-700 font-bold">{{ formattedBookingDateTime }}</div>
                        </div>

                        <h1 class="text-xl font-bold mb-4 text-center">{{ isRescheduling ? 'Подтвердите данные' : 'Ваши данные' }}</h1>
                        
                        <div class="flex gap-2 mb-4 bg-teal-50/50 p-1.5 rounded-[18px] border-2 border-teal-100/50">
                            <button @click="setPatientMode('myself')" :class="patientMode === 'myself' ? 'flex-1 py-3 rounded-xl text-xs font-bold bg-white text-teal-600 shadow-sm transition-all border-none cursor-pointer' : 'flex-1 py-3 rounded-xl text-xs font-bold text-gray-500 hover:bg-white/50 transition-all border-none cursor-pointer bg-transparent'">Записать себя</button>
                            <button @click="setPatientMode('other')" :class="patientMode === 'other' ? 'flex-1 py-3 rounded-xl text-xs font-bold bg-white text-teal-600 shadow-sm transition-all border-none cursor-pointer' : 'flex-1 py-3 rounded-xl text-xs font-bold text-gray-500 hover:bg-white/50 transition-all border-none cursor-pointer bg-transparent'">Другой человек</button>
                        </div>

                        <div class="space-y-4">
                            <input type="text" v-model="patientForm.last_name" placeholder="Фамилия*" class="input-yasno">
                            <input type="text" v-model="patientForm.first_name" placeholder="Имя*" class="input-yasno">
                            <input type="text" v-model="patientForm.middle_name" placeholder="Отчество" class="input-yasno">
                            <input type="text" :value="patientForm.birth_date" @input="handleDateInput" maxlength="10" placeholder="Дата рождения*" class="input-yasno">
                            <input type="tel" :value="patientForm.phone" @input="handlePhoneInput" maxlength="18" placeholder="Телефон*" class="input-yasno">
                            <label class="flex items-center gap-3 p-4 glass-card cursor-pointer">
                                <input type="checkbox" v-model="patientForm.consent" class="w-5 h-5 accent-[#32a396]">
                                <span class="text-[11px] leading-tight font-semibold">Напоминать мне о визите за 24 часа и за 2 часа</span>
                            </label>
                            <button @click="sendBooking" :disabled="isSubmitting" class="w-full btn-yasno py-5 shadow-xl mt-4 uppercase border-none">
                                {{ isSubmitting ? 'ОБРАБОТКА...' : (isRescheduling ? 'ПОДТВЕРДИТЬ ПЕРЕНОС' : 'ЗАПИСАТЬСЯ НА ПРИЕМ') }}
                            </button>
                            <p class="text-[10px] text-gray-500 text-center mt-2 px-2 leading-tight">
                                Нажимая кнопку, вы соглашаетесь с политикой конфиденциальности.
                            </p>
                        </div>
                    </div>

                    <div v-if="currentView === 'view-my-appointment'" class="view-animate">
                        <div class="flex justify-between items-center mb-4">
                            <button @click="showView('view-branches')" class="nav-btn">← На главную</button>
                        </div>
                        <h1 class="text-xl font-bold mb-6 text-center">Активная запись</h1>
                        <div v-if="myAppointmentData" class="glass-card p-6 mb-6">
                            <div class="font-bold text-lg mb-1">{{ myAppointmentData.displayBranch }}</div>
                            <div class="font-bold text-lg text-teal-600 mb-3">{{ myAppointmentData.formattedDate }} в {{ myAppointmentData.time }}</div>
                            <div class="font-medium text-sm text-gray-800 mb-1 leading-tight">{{ myAppointmentData.service_name || 'Прием офтальмолога' }}</div>
                            <div class="opacity-70 text-sm">{{ myAppointmentData.doctor_name }}</div>
                        </div>
                        <button @click="startReschedule" class="w-full border-2 border-[#59c2b1] text-[#32a396] bg-white py-4 font-bold rounded-full uppercase mb-3 shadow-sm transition-all active:scale-95 cursor-pointer">Перенести приём</button>
                        <button @click="cancelAppointment" :disabled="isCancelling" class="w-full border-2 border-red-400 text-red-500 py-4 font-bold rounded-full uppercase transition-all active:scale-95 cursor-pointer bg-white">
                            {{ isCancelling ? 'ОТМЕНА...' : 'Отменить приём' }}
                        </button>
                    </div>

                    <div v-if="currentView === 'view-success'" class="text-center py-10 view-animate">
                        <button @click="showView('view-branches')" class="btn-yasno w-full py-5 mb-10 shadow-lg uppercase tracking-widest text-sm border-none">На главную страницу</button>
                        <div class="text-6xl mb-6">✨</div>
                        <h2 class="text-3xl font-black mb-4">Ждем вас!</h2>
                        <p class="text-sm opacity-60 mb-20 px-4 leading-relaxed">Ваша запись успешно подтверждена. Вы получите уведомление.</p>
                    </div>
                </template>
            </div>
        </div>

        <div v-if="showNoAppointmentsModal" class="fixed inset-0 z-[100] flex items-center justify-center px-6">
            <div class="absolute inset-0 bg-black/60 backdrop-blur-sm"></div>
            <div class="glass-card relative p-8 w-full max-w-sm text-center shadow-2xl border-2 border-gray-100 bg-white">
                <div class="text-4xl mb-4">📂</div>
                <h3 class="text-lg font-bold mb-6 leading-tight">Активных записей не найдено.</h3>
                <button @click="showNoAppointmentsModal = false" class="btn-yasno w-full py-4 text-xs border-none">ПОНЯТНО</button>
            </div>
        </div>

        <div v-if="showCallCenterModal" class="fixed inset-0 z-[100] flex items-center justify-center px-6">
            <div class="absolute inset-0 bg-black/40 backdrop-blur-sm"></div>
            <div class="glass-card relative p-8 w-full max-w-sm text-center shadow-2xl border-2 border-teal-100 bg-white">
                <div class="text-4xl mb-4">📞</div>
                <h3 class="text-lg font-bold mb-4 leading-tight text-black">
                    Для осуществления второй записи обратитесь в Call-центр<br>
                    <a href="tel:+74955454649" class="text-teal-600 underline text-xl font-black mt-2 block">+7 (495) 545-46-49</a>
                </h3>
                <button @click="showCallCenterModal = false" class="btn-yasno w-full py-4 text-xs uppercase tracking-widest border-none mt-6">Понятно</button>
            </div>
        </div>
    </div>

    <script>
        const { createApp, ref, reactive, computed, onMounted } = Vue;

        createApp({
            setup() {
                const serviceAliases = {
                    "Комплексная офтальмологическая диагностика с консультацией врача офтальмолога - к.м.н..": "Комплексная диагностика (к.м.н.)",
                    "Комплексная офтальмологическая диагностика с консультацией врача - офтальмолога при глаукоме": "Комплексная диагностика (при глаукоме)",
                    "Комплексная офтальмологическая диагностика с консультацией врача - офтальмолога..": "Комплексная диагностика"
                };
                const monthsRU = ['января', 'февраля', 'марта', 'апреля', 'мая', 'июня', 'июля', 'августа', 'сентября', 'октября', 'ноября', 'декабря'];
                const daysRU = ['Воскресенье', 'Понедельник', 'Вторник', 'Среда', 'Четверг', 'Пятница', 'Суббота'];

                const accessError = ref(false);
                let userTgId = null;

                const currentView = ref('view-branches');
                const curBranch = ref('');
                const curPath = ref('');
                const curDoc = ref({});
                const curService = ref({});
                const curDate = ref('');
                const curTime = ref('');
                const scheduleStartDate = ref(new Date());

                const isRescheduling = ref(false);
                const activeAppointmentId = ref(null);
                const myAppointmentData = ref(null);

                const doctorsList = ref([]);
                const servicesPrimary = ref([]);
                const servicesSecondary = ref([]);
                const scheduleDays = ref([]);
                const schedulePeriodLabel = ref('Загрузка...');
                
                let globalDoctorsCache = [];
                let globalServicesMap = {};

                const loadingDoctors = ref(false);
                const loadingServices = ref(false);
                const loadingServicesText = ref('Получение услуг...');
                const loadingSchedule = ref(false);
                const isSubmitting = ref(false);
                const isCancelling = ref(false);

                const showNoAppointmentsModal = ref(false);
                const showCallCenterModal = ref(false);

                const patientForm = reactive({
                    last_name: '', first_name: '', middle_name: '', birth_date: '', phone: '', consent: true
                });
                const patientMode = ref('myself');

                const formattedBookingDateTime = computed(() => {
                    if (!curDate.value) return '';
                    const [y, m, d] = curDate.value.split('-');
                    return `${parseInt(d)} ${monthsRU[parseInt(m)-1]} в ${curTime.value}`;
                });

                const showAppAlert = (msg, callback) => {
                    alert(msg);
                    if(callback) callback();
                };

                const showAppConfirm = (msg, callback) => {
                    callback(confirm(msg));
                };

                // Инициализация при загрузке приложения
                onMounted(() => {
                    const urlParams = new URLSearchParams(window.location.search);
                    userTgId = urlParams.get('user_id');

                    if (!userTgId) {
                        userTgId = localStorage.getItem('max_user_id');
                        if (!userTgId) {
                            accessError.value = true;
                            return;
                        }
                    } else {
                        localStorage.setItem('max_user_id', userTgId);
                    }
                    
                    showView('view-branches');
                });

                const showView = (id) => {
                    currentView.value = id;
                    if (id === 'view-booking') setPatientMode('myself');
                };

                const selectBranch = (name) => {
                    curBranch.value = name;
                    showView('view-path');
                };

                const selectPath = (pathType) => {
                    curPath.value = pathType;
                    if (pathType === 'doctor') {
                        showView('view-doctors');
                        loadAllDoctorsForBranch();
                    } else {
                        showView('view-services');
                        loadAllServicesForBranch();
                    }
                };

                const goBackFromDoctors = () => {
                    if (curPath.value === 'doctor') showView('view-path');
                    else showView('view-services');
                };

                const goBackFromServices = () => {
                    if (curPath.value === 'service') showView('view-path');
                    else showView('view-doctors');
                };

                const goBackFromSchedule = () => {
                    if (curPath.value === 'doctor') showView('view-services');
                    else showView('view-doctors');
                };

                const loadAllDoctorsForBranch = async () => {
                    loadingDoctors.value = true;
                    doctorsList.value = [];
                    try {
                        const r = await fetch(`/max/doctors?branch=${encodeURIComponent(curBranch.value)}`);
                        const data = await r.json();
                        doctorsList.value = Array.isArray(data) ? data : (data.data || []);
                    } catch (e) {
                        doctorsList.value = [];
                    } finally {
                        loadingDoctors.value = false;
                    }
                };

                const selectDoctor = (doc) => {
                    curDoc.value = { id: doc.id, name: doc.full_name };
                    if (curPath.value === 'doctor') {
                        showView('view-services');
                        loadServicesForDoctor();
                    } else {
                        initSchedule();
                    }
                };

                const loadServicesForDoctor = async () => {
                    loadingServices.value = true;
                    loadingServicesText.value = 'Получение услуг...';
                    servicesPrimary.value = [];
                    servicesSecondary.value = [];
                    try {
                        const r = await fetch(`/max/services?doctor_id=${curDoc.value.id}`);
                        const res = await r.json();
                        const servicesData = Array.isArray(res) ? res : (res.data || []);
                        
                        servicesData.forEach((s) => {
                            if (s.id === 'empty') return;
                            let displayName = serviceAliases[s.name] || s.name.replace(/\.\.$/, '');
                            let serviceObj = { id: s.id, name: s.name, displayName, price: s.price };
                            if (displayName.toLowerCase().includes('повторн')) servicesSecondary.value.push(serviceObj);
                            else servicesPrimary.value.push(serviceObj);
                        });
                    } catch(e) {} finally {
                        loadingServices.value = false;
                    }
                };

                const loadAllServicesForBranch = async () => {
                    loadingServices.value = true;
                    loadingServicesText.value = 'Синхронизация услуг клиники...<br><span class="text-xs opacity-50">(это займет пару секунд)</span>';
                    servicesPrimary.value = [];
                    servicesSecondary.value = [];
                    try {
                        let docsRes = await fetch(`/max/doctors?branch=${encodeURIComponent(curBranch.value)}`);
                        let docsData = await docsRes.json();
                        globalDoctorsCache = Array.isArray(docsData) ? docsData : (docsData.data || []);
                        if (globalDoctorsCache.length === 0) return;

                        let fetchPromises = globalDoctorsCache.map(doc => fetch(`/max/services?doctor_id=${doc.id}`).then(r => r.json()).catch(() => []));
                        let servicesResults = await Promise.all(fetchPromises);
                        globalServicesMap = {};
                        
                        servicesResults.forEach((srvData, index) => {
                            let doc = globalDoctorsCache[index];
                            let srvList = Array.isArray(srvData) ? srvData : (srvData.data || []);
                            srvList.forEach(s => {
                                if (s.id === 'empty') return;
                                let displayName = serviceAliases[s.name] || s.name.replace(/\.\.$/, '');
                                if (!globalServicesMap[s.id]) globalServicesMap[s.id] = { id: s.id, name: s.name, displayName, price: s.price, doctors: [] };
                                globalServicesMap[s.id].doctors.push(doc);
                            });
                        });

                        Object.values(globalServicesMap).forEach(s => {
                            if (s.displayName.toLowerCase().includes('повторн')) servicesSecondary.value.push(s);
                            else servicesPrimary.value.push(s);
                        });
                    } catch(e) {} finally {
                        loadingServices.value = false;
                    }
                };

                const selectService = (service) => {
                    curService.value = { id: service.id, name: service.name, displayName: service.displayName };
                    if (curPath.value === 'service') {
                        showView('view-doctors');
                        doctorsList.value = globalServicesMap[service.id]?.doctors || [];
                    } else {
                        initSchedule();
                    }
                };

                const initSchedule = () => {
                    scheduleStartDate.value = new Date();
                    showView('view-schedule-multi');
                    loadScheduleMulti();
                };

                const shiftSchedule = (days) => {
                    let newDate = new Date(scheduleStartDate.value);
                    newDate.setDate(newDate.getDate() + days);
                    let today = new Date(); today.setHours(0,0,0,0);
                    if (newDate < today) newDate = new Date(today);
                    scheduleStartDate.value = newDate;
                    loadScheduleMulti();
                };

                const loadScheduleMulti = async () => {
                    loadingSchedule.value = true;
                    scheduleDays.value = [];
                    
                    let datesToLoad = [];
                    for(let i=0; i<4; i++) { 
                        let d = new Date(scheduleStartDate.value); 
                        d.setDate(d.getDate() + i); 
                        datesToLoad.push(d); 
                    }
                    schedulePeriodLabel.value = `${datesToLoad[0].getDate()} ${monthsRU[datesToLoad[0].getMonth()]} — ${datesToLoad[3].getDate()} ${monthsRU[datesToLoad[3].getMonth()]}`;

                    try {
                        let promises = datesToLoad.map(dateObj => {
                            let dateStr = dateObj.toISOString().split('T')[0];
                            return fetch(`/max/schedule?doctor_id=${curDoc.value.id}&date=${dateStr}&branch=${encodeURIComponent(curBranch.value)}`)
                                   .then(r => r.json()).then(data => ({ dateObj, data })).catch(() => ({ dateObj, data: null }));
                        });
                        let results = await Promise.all(promises);
                        let todayStr = new Date().toISOString().split('T')[0];

                        scheduleDays.value = results.map(res => {
                            let dObj = res.dateObj; 
                            let dStr = dObj.toISOString().split('T')[0];
                            let slots = (res.data && res.data.status === 'success' && res.data.free_slots) ? res.data.free_slots : [];
                            return {
                                dateStr: dStr,
                                isToday: dStr === todayStr,
                                dateNum: dObj.getDate(),
                                dayName: daysRU[dObj.getDay()],
                                slots: slots
                            };
                        });
                    } catch(e) {} finally {
                        loadingSchedule.value = false;
                    }
                };

                const selectTime = (dateStr, timeStr) => {
                    curDate.value = dateStr;
                    curTime.value = timeStr;
                    showView('view-booking');
                };

                const formatPrice = (price) => {
                    if (!price) return '';
                    return new Intl.NumberFormat('ru-RU').format(price) + ' ₽';
                };

                const handlePhoneInput = (e) => {
                    let val = e.target.value.replace(/\D/g, ''); 
                    if (val.startsWith('8')) val = '7' + val.substring(1); 
                    let f = ''; 
                    if (val.length > 0) { 
                        f = '+7 '; 
                        if (val.length > 1) f += '(' + val.substring(1, 4); 
                        if (val.length >= 5) f += ') ' + val.substring(4, 7); 
                        if (val.length >= 8) f += '-' + val.substring(7, 9); 
                        if (val.length >= 10) f += '-' + val.substring(9, 11); 
                    } 
                    patientForm.phone = f;
                };

                const handleDateInput = (e) => {
                    let x = e.target.value.replace(/\D/g, '').match(/(\d{0,2})(\d{0,2})(\d{0,4})/); 
                    if(x) patientForm.birth_date = !x[2] ? x[1] : x[1] + '.' + x[2] + (x[3] ? '.' + x[3] : '');
                };

                const setPatientMode = (mode) => {
                    patientMode.value = mode;
                    if (mode === 'myself') {
                        const fillForm = (saved) => { 
                            if (!saved) return; 
                            ['last_name', 'first_name', 'middle_name', 'birth_date', 'phone'].forEach(f => { 
                                if (saved[f]) patientForm[f] = saved[f]; 
                            }); 
                        };
                        try {
                            fillForm(JSON.parse(localStorage.getItem('max_patient_data') || '{}')); 
                        } catch(e){}
                    } else {
                        ['last_name', 'first_name', 'middle_name', 'birth_date', 'phone'].forEach(f => patientForm[f] = '');
                    }
                };

                const checkMyAppointment = () => {
                    fetch(`/max/my_appointment?tg_id=${userTgId}`).then(r => r.json()).then(res => {
                        if (res.has_appointment) {
                            let d = res.data; 
                            activeAppointmentId.value = d.appointment_id || d.id || res.appointment_id; 
                            myAppointmentData.value = {
                                displayBranch: d.branch === 'Ватутинки' ? 'Новые Ватутинки' : d.branch,
                                formattedDate: d.date.split('-').reverse().join('.'),
                                time: d.time,
                                service_name: d.service_name,
                                doctor_name: d.doctor_name
                            };
                            showView('view-my-appointment');
                        } else { 
                            showNoAppointmentsModal.value = true; 
                        }
                    }).catch(() => { showNoAppointmentsModal.value = true; });
                };

                const startReschedule = () => {
                    if (!activeAppointmentId.value) { showAppAlert('Системная ошибка. Отмените текущую запись и создайте новую.'); return; }
                    isRescheduling.value = true; 
                    showView('view-branches'); 
                };

                const sendBooking = () => {
                    if(!patientForm.last_name || !patientForm.first_name || !patientForm.birth_date || !patientForm.phone) {
                        return showAppAlert('Пожалуйста, заполните обязательные поля');
                    }

                    isSubmitting.value = true;
                    
                    const payload = {
                        tg_id: userTgId, 
                        branch: curBranch.value, doctor_id: curDoc.value.id, doctor_name: curDoc.value.name,
                        service_id: curService.value.id, service_name: curService.value.name, date: curDate.value, time: curTime.value,
                        patient: { ...patientForm }
                    };

                    let endpoint = `/max/book?send_notifications=${patientForm.consent}`;
                    if (isRescheduling.value) { 
                        payload.old_appointment_id = activeAppointmentId.value; 
                        endpoint = `/max/reschedule?send_notifications=${patientForm.consent}`; 
                    }

                    fetch(endpoint, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(payload) })
                    .then(async r => {
                        if (!r.ok) {
                            const err = await r.json(); showAppAlert('Ошибка: ' + JSON.stringify(err.detail || err));
                            throw new Error('Server Error');
                        }
                        return r.json();
                    })
                    .then(r => {
                        if(r.status === 'success') { 
                            const pd = JSON.stringify({ 
                                last_name: patientForm.last_name, first_name: patientForm.first_name, 
                                middle_name: patientForm.middle_name, phone: patientForm.phone, birth_date: patientForm.birth_date 
                            });
                            try { localStorage.setItem('max_patient_data', pd); } catch(err) {}
                            
                            isRescheduling.value = false;  
                            try { if (typeof confetti === 'function') confetti(); } catch(e){} 
                            showView('view-success'); 
                        }
                        else if (r.error === "SECOND_BOOKING_ERROR") { showCallCenterModal.value = true; }
                        else { showAppAlert(r.error || 'Ошибка'); }
                    })
                    .catch(e => { console.error(e); })
                    .finally(() => { isSubmitting.value = false; });
                };

                const cancelAppointment = () => {
                    showAppConfirm('Отменить запись?', (ok) => { 
                        if (ok) {
                            isCancelling.value = true;
                            fetch('/max/cancel', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ tg_id: userTgId }) })
                            .then(r => r.json()).then(r => { 
                                if(r.status === 'success') { isRescheduling.value = false; showAppAlert('Запись отменена', () => showView('view-branches')); } 
                                else { showAppAlert('Ошибка: ' + r.error); }
                            }).catch(e => { showAppAlert('Сетевая ошибка'); })
                            .finally(() => { isCancelling.value = false; }); 
                        } 
                    });
                };

                return {
                    accessError, currentView, curBranch, curPath, curDoc, curService, curDate, curTime, schedulePeriodLabel,
                    isRescheduling, activeAppointmentId, myAppointmentData,
                    doctorsList, servicesPrimary, servicesSecondary, scheduleDays,
                    loadingDoctors, loadingServices, loadingServicesText, loadingSchedule, isSubmitting, isCancelling,
                    showNoAppointmentsModal, showCallCenterModal, patientForm, patientMode,
                    formattedBookingDateTime,
                    showView, selectBranch, selectPath, goBackFromDoctors, goBackFromServices, goBackFromSchedule,
                    selectDoctor, selectService, initSchedule, shiftSchedule, selectTime, formatPrice,
                    handlePhoneInput, handleDateInput, setPatientMode, checkMyAppointment, startReschedule,
                    sendBooking, cancelAppointment
                };
            }
        }).mount('#app');
    </script>
</body>
</html>
